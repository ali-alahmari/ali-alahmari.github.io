<style>
:root{
  --ink:#0D1A16; --ink-2:#3A4E47; --ink-3:#6B7F77;
  --bg:#EFF3F1; --surface:#FFFFFF; --surface-2:#E6EDE9; --surface-3:#F7FAF8;
  --line:#D3DED9; --line-2:#B9C8C2;
  --pine:#0D5A46; --pine-2:#127A5E; --pine-3:#1B9B78; --pine-soft:#D9EBE4;
  --brass:#8A6A1F; --brass-2:#B08A2E; --brass-soft:#F4EBD5;
  --spine:#C0D2CB;
  --hero-1:#0D5A46; --hero-2:#0A3F33; --hero-ink:#EAF5F0; --hero-ink-2:#9FC9B9;
  --shadow-s:0 1px 2px rgba(13,26,22,.05);
  --shadow:0 1px 2px rgba(13,26,22,.05), 0 10px 30px -16px rgba(13,26,22,.24);
  --shadow-l:0 2px 4px rgba(13,26,22,.06), 0 22px 50px -24px rgba(13,26,22,.34);
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7F0EC; --ink-2:#A5BBB3; --ink-3:#7A9088;
    --bg:#080D0C; --surface:#101917; --surface-2:#16221E; --surface-3:#0C1413;
    --line:#20302A; --line-2:#2F433B;
    --pine:#54C7A1; --pine-2:#6FD9B5; --pine-3:#8AE6C7; --pine-soft:#0D2B23;
    --brass:#D9B76C; --brass-2:#E7CB8C; --brass-soft:#2B2415;
    --spine:#28382F;
    --hero-1:#0E2E27; --hero-2:#071815; --hero-ink:#E7F0EC; --hero-ink-2:#7FB8A3;
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -18px rgba(0,0,0,.75);
    --shadow-l:0 2px 6px rgba(0,0,0,.5), 0 26px 56px -26px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ink:#E7F0EC; --ink-2:#A5BBB3; --ink-3:#7A9088;
  --bg:#080D0C; --surface:#101917; --surface-2:#16221E; --surface-3:#0C1413;
  --line:#20302A; --line-2:#2F433B;
  --pine:#54C7A1; --pine-2:#6FD9B5; --pine-3:#8AE6C7; --pine-soft:#0D2B23;
  --brass:#D9B76C; --brass-2:#E7CB8C; --brass-soft:#2B2415;
  --spine:#28382F;
  --hero-1:#0E2E27; --hero-2:#071815; --hero-ink:#E7F0EC; --hero-ink-2:#7FB8A3;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -18px rgba(0,0,0,.75);
  --shadow-l:0 2px 6px rgba(0,0,0,.5), 0 26px 56px -26px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Sakkal Majalla","Majalla UI","IBM Plex Sans Arabic","Cairo",system-ui,sans-serif;
  font-size:15px; line-height:1.78; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Sakkal Majalla","Majalla UI","Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;margin:0;line-height:1.4;text-wrap:balance;font-weight:700}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}

/* ================= top bar ================= */
.bar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.mark{display:flex;align-items:center;gap:11px;min-width:0}
.sigil{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--pine-2),var(--pine));color:#fff;display:grid;place-items:center;font-family:"Sakkal Majalla","Majalla UI","Cairo",sans-serif;font-weight:700;font-size:13px;flex:none;box-shadow:var(--shadow-s);overflow:hidden}
.sigil img{width:100%;height:100%;object-fit:cover}
:root[data-theme="dark"] .sigil,:root:not([data-theme="light"]) .sigil{color:#071815}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .sigil{color:#fff}}
.mark b{font-family:"Sakkal Majalla","Majalla UI","Cairo",sans-serif;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-actions{display:flex;gap:7px;align-items:center;flex:none}
.btn{
  font-family:inherit;font-size:13px;border-radius:99px;padding:7px 15px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  transition:border-color .18s,color .18s,background .18s,transform .12s;
}
.btn:hover{border-color:var(--pine);color:var(--ink);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.btn.primary{background:linear-gradient(140deg,var(--pine-2),var(--pine));border-color:transparent;color:#fff;font-weight:600;box-shadow:var(--shadow-s)}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#071815}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.icon{padding:7px 11px;font-size:14px;line-height:1}

/* ================= hero ================= */
.hero{
  position:relative;overflow:hidden;color:var(--hero-ink);
  background:linear-gradient(150deg,var(--hero-1) 0%,var(--hero-2) 100%);
  padding:0 0 32px;
}
.hero::before{
  content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.5) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.5) 0 1px, transparent 1px 26px);
  mask-image:radial-gradient(120% 90% at 85% 0%, #000 0%, transparent 72%);
  -webkit-mask-image:radial-gradient(120% 90% at 85% 0%, #000 0%, transparent 72%);
}
.hero::after{
  content:"";position:absolute;inset-inline-end:-90px;top:-110px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.14), transparent 62%);pointer-events:none;
}
.hero-in{position:relative;max-width:1200px;margin:0 auto;padding:44px 22px 0;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:start}
@media(max-width:720px){.hero-in{grid-template-columns:1fr;gap:20px}}

/* photo */
.avatar{position:relative;width:132px;height:132px;flex:none}
.avatar .frame{
  width:132px;height:132px;border-radius:24px;overflow:hidden;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.24);
  display:grid;place-items:center;box-shadow:0 18px 40px -20px rgba(0,0,0,.6);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .ini{font-family:"Sakkal Majalla","Majalla UI","Cairo",sans-serif;font-size:40px;font-weight:700;color:rgba(255,255,255,.72);letter-spacing:.04em}
.avatar .edit{
  position:absolute;inset-block-end:-9px;inset-inline-start:50%;transform:translateX(50%);
  font-family:inherit;font-size:11.5px;border:none;border-radius:99px;padding:5px 13px;cursor:pointer;white-space:nowrap;
  background:var(--brass-2);color:#241C07;font-weight:600;box-shadow:0 6px 16px -6px rgba(0,0,0,.55);
}
.avatar .edit:hover{filter:brightness(1.07)}
.avatar .edit:focus-visible{outline:2px solid #fff;outline-offset:2px}
.photohint{font-size:11.5px;color:var(--hero-ink-2);margin-top:20px;text-align:center;max-width:150px}

.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-ink-2);font-weight:600;font-family:"IBM Plex Mono",monospace}
.hero h1{font-size:clamp(29px,4.6vw,45px);margin:11px 0 9px;letter-spacing:-.01em;color:#fff;font-weight:900}
:root[data-theme="dark"] .hero h1,:root:not([data-theme="light"]) .hero h1{color:var(--hero-ink)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .hero h1{color:#fff}}
.hero .role{font-size:clamp(14.5px,1.9vw,17.5px);color:var(--hero-ink-2);font-weight:500;max-width:58ch;line-height:1.7}
.contact{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.cbit{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--hero-ink);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:6px 15px;text-decoration:none;transition:background .18s}
.cbit:hover{background:rgba(255,255,255,.17)}
.cbit svg{width:14px;height:14px;flex:none;stroke:var(--hero-ink-2);fill:none;stroke-width:1.8}

.stats{position:relative;max-width:1200px;margin:26px auto 0;padding:0 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:var(--r);
  padding:15px 17px;backdrop-filter:blur(6px);position:relative;overflow:hidden;
}
.stat::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--brass-2)}
.stat .n{direction:ltr;font-family:"Sakkal Majalla","Majalla UI","Cairo",sans-serif;font-size:33px;font-weight:900;color:#fff;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
:root[data-theme="dark"] .stat .n,:root:not([data-theme="light"]) .stat .n{color:var(--pine-3)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .stat .n{color:#fff}}
.stat .t{font-size:12.5px;color:var(--hero-ink-2);margin-top:6px;line-height:1.6}

/* ================= sections ================= */
section{margin-top:44px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.shead h2{font-size:20px}
.shead .idx{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--brass);background:var(--brass-soft);
  border-radius:6px;padding:3px 8px;letter-spacing:.06em;font-weight:500;flex:none
}
.shead .rule{flex:1;height:1px;background:linear-gradient(to left,var(--line-2),transparent)}
.lede{color:var(--ink-2);font-size:13.5px;margin:0 0 16px;max-width:82ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px 24px}
.summary{font-size:15.5px;line-height:2;color:var(--ink-2);max-width:80ch;margin:0}

/* ================= span chart ================= */
.spanchart{padding:24px 24px 16px}
.axis{position:relative;height:20px;margin-bottom:12px;border-bottom:1px solid var(--line-2)}
.tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:11px;color:var(--ink-3)}
.tick::after{content:"";position:absolute;bottom:-5px;inset-inline-start:50%;width:1px;height:5px;background:var(--line-2)}
.lane{position:relative;height:46px;margin-bottom:2px}
.lane .rail{position:absolute;top:28px;height:8px;inset-inline:0;background:var(--surface-2);border-radius:99px}
.lane .barx{position:absolute;top:26px;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--pine-2),var(--pine));display:flex;align-items:center;justify-content:center;padding:0 6px;overflow:hidden;box-shadow:var(--shadow-s)}
.lane .barx.past{background:var(--spine);box-shadow:none}
.lane .barx span{font-size:10px;color:#fff;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-weight:500}
:root[data-theme="dark"] .lane .barx span,:root:not([data-theme="light"]) .lane .barx span{color:#071815}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .lane .barx span{color:#fff}}
.lane .lbl{position:absolute;inset-inline-start:0;top:2px;font-size:12.5px;color:var(--ink-2);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;font-weight:500}
.lane .yrs{position:absolute;inset-inline-end:0;top:2px;font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.spanlegend{display:flex;gap:18px;font-size:12px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}

/* ================= timeline ================= */
.tl{position:relative;padding-inline-start:28px}
.tl::before{content:"";position:absolute;inset-block:8px;inset-inline-start:6px;width:2px;background:linear-gradient(var(--pine),var(--spine))}
.job{position:relative;margin-bottom:14px}
.job::before{content:"";position:absolute;inset-inline-start:-28px;top:21px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--spine)}
.job.now::before{border-color:var(--pine);box-shadow:0 0 0 5px var(--pine-soft)}
.jhead{width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 19px;cursor:pointer;font-family:inherit;color:inherit;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start;justify-content:space-between;transition:border-color .18s}
.jhead:hover{border-color:var(--pine)}
.jhead:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.jtitle{font-family:"Sakkal Majalla","Majalla UI","Cairo",sans-serif;font-weight:700;font-size:15.5px;display:block}
.jorg{font-size:13.5px;color:var(--pine);font-weight:600;margin-top:3px;display:block}
.jmeta{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:block}
.jright{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.chip-now{font-size:11px;background:var(--pine-soft);color:var(--pine);border-radius:99px;padding:2px 11px;font-weight:700;white-space:nowrap}
.caret{font-size:11px;color:var(--ink-3);transition:transform .22s}
.job.open .caret{transform:rotate(180deg)}
.jbody{padding:6px 19px 18px;border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r) var(--r);background:var(--surface);margin-top:-1px;display:none}
.job.open .jbody{display:block}
.job.open .jhead{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent}
.jlead{font-size:14px;color:var(--ink-2);border-inline-start:3px solid var(--pine);padding-inline-start:13px;margin:10px 0 13px;line-height:1.85}
.jbody ul{margin:0;padding-inline-start:19px;font-size:13.5px;color:var(--ink-2)}
.jbody li{margin-bottom:7px}
.jbody li::marker{color:var(--pine)}

/* ================= grids ================= */
.two{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:13px}

.comp{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--pine)}
.comp h4{font-size:14px;color:var(--pine);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
.comp h4 em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);background:var(--surface-2);border-radius:5px;padding:1px 7px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:7px;padding:3px 11px}

.proj{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--brass-2)}
.proj h4{font-size:14px;margin-bottom:6px}
.proj p{margin:0;font-size:13px;color:var(--ink-2)}

.cert{display:flex;gap:13px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.cert:last-child{border-bottom:none;padding-bottom:0}
.seal{width:42px;height:42px;border-radius:11px;background:linear-gradient(140deg,var(--brass-soft),var(--surface-2));color:var(--brass);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;flex:none;border:1px solid var(--line)}
.cert b{display:block;font-size:13.5px;font-weight:600;line-height:1.55}
.cert span{font-size:12px;color:var(--ink-3)}

.edu{border-inline-start:3px solid var(--pine);padding-inline-start:15px}
.edu b{display:block;font-size:14.5px;font-family:"Sakkal Majalla","Majalla UI","Cairo",sans-serif;font-weight:700}
.edu span{font-size:13px;color:var(--ink-2);display:block}
.edu em{font-style:normal;font-size:12.5px;color:var(--ink-3)}

.lang{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lang:last-child{border-bottom:none;padding-bottom:0}
.lang b{font-size:14px;font-family:"Sakkal Majalla","Majalla UI","Cairo",sans-serif;font-weight:700}
.lang span{font-size:12.5px;color:var(--pine);background:var(--pine-soft);border-radius:99px;padding:3px 13px;text-align:center}

/* quote */
.quote{background:linear-gradient(150deg,var(--surface),var(--surface-3));border:1px solid var(--line);border-inline-start:4px solid var(--brass-2);border-radius:var(--r);padding:22px 26px;box-shadow:var(--shadow);margin-top:14px}
.qgrade{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--brass);background:var(--brass-soft);border-radius:7px;padding:4px 13px;margin-bottom:13px;font-weight:500}
.qtext{font-size:15px;line-height:1.95;color:var(--ink);font-style:italic;margin:0 0 11px}
.qsrc{font-size:12.5px;color:var(--ink-3)}

/* rows (contracts, committees, recognition) */
.rowline{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:none;padding-bottom:0}
.rowline .yr{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--pine);background:var(--pine-soft);border-radius:7px;padding:4px 11px;flex:none;white-space:nowrap}
.rowline .yr.b{color:var(--brass);background:var(--brass-soft)}
.rowline .bullet{color:var(--pine);font-size:10px;flex:none;line-height:2.2}
.rowline p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.8}

/* training ledger */
.ledger{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.ledger th{text-align:start;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 11px 10px;border-bottom:1px solid var(--line-2)}
.ledger td{padding:9px 11px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
.ledger tr:last-child td{border-bottom:none}
.ledger td.h{white-space:nowrap;color:var(--pine);font-weight:500;font-size:12.5px}
.ledger tbody tr:hover td{background:var(--surface-2)}
.scrollx{overflow-x:auto}
.totline{margin-top:14px;font-size:13px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.totline b{color:var(--pine);font-family:"IBM Plex Mono",monospace;font-size:15px}

footer{margin:48px 0 64px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ---------- theme ---------- */
document.getElementById('themeBtn').addEventListener('click', () => {
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
});

/* ---------- career span ---------- */
const START = 2002, END = 2026.7;
const toY = s => { const [y,m] = s.split("-").map(Number); return y + (m-1)/12; };

function renderSpan(){
  const axis = document.getElementById('axis');
  axis.innerHTML = "";
  for (let y = 2002; y <= 2026; y += 4){
    const d = document.createElement('div');
    d.className = "tick mono"; d.textContent = y;
    d.style.insetInlineStart = (100*(y-START)/(END-START)) + "%";
    axis.appendChild(d);
  }
  const ordered = [...CV.experience].sort((a,b) => toY(a.from) - toY(b.from));
  document.getElementById('lanes').innerHTML = ordered.map(j => {
    const a = toY(j.from), b = j.to ? toY(j.to) : END;
    const left = 100*(a-START)/(END-START), w = Math.max(2, 100*(b-a)/(END-START));
    const yrs = ((b-a)).toFixed(1).replace(/\.0$/,"");
    const unit = L==='ar' ? ' سنة' : ' yrs';
    return `<div class="lane">
      <div class="lbl">${pick(j,'role')}</div>
      <div class="yrs">${pick(j,'period')}</div>
      <div class="rail"></div>
      <div class="barx ${j.current?'':'past'}" style="inset-inline-start:${left}%;width:${w}%" title="${pick(j,'period')}">
        ${w > 12 ? `<span>${yrs}${unit}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

  document.getElementById('committees').innerHTML  = rows(CV.committees, false);

  document.getElementById('projects').innerHTML = CV.projects.map(p => {

  document.getElementById('tothrs').textContent = CV.training_hours_total + (L==='ar' ? ' ساعة' : ' hours');
